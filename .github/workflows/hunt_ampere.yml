name: Hunt Oracle Ampere A1

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  launch-instance:
    runs-on: ubuntu-latest

    steps:
      - name: Setup OCI CLI & Config
        env:
          OCI_KEY_RAW: ${{ secrets.OCI_API_KEY }}
          OCI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_FP: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REG: ${{ secrets.OCI_REGION }}
        run: |
          pip install --no-cache-dir oci-cli

          mkdir -p /home/runner/.oci

          # 1. Limpiar la clave privada de caracteres Windows (\r)
          echo "$OCI_KEY_RAW" | tr -d '\r' > /home/runner/.oci/oci_api_key.pem
          chmod 600 /home/runner/.oci/oci_api_key.pem

          # 2. Limpiar espacios y retornos en variables
          USER_CLEAN=$(echo "$OCI_USER" | tr -d ' \r\n\t')
          FP_CLEAN=$(echo "$OCI_FP" | tr -d ' \r\n\t')
          TENANCY_CLEAN=$(echo "$OCI_TENANCY" | tr -d ' \r\n\t')
          REGION_CLEAN=$(echo "$OCI_REG" | tr -d ' \r\n\t')

          # 3. Generar config con valores limpios y ruta fija
          cat <<EOF > /home/runner/.oci/config
          [DEFAULT]
          user=$USER_CLEAN
          fingerprint=$FP_CLEAN
          tenancy=$TENANCY_CLEAN
          region=$REGION_CLEAN
          key_file=/home/runner/.oci/oci_api_key.pem
          EOF
          chmod 600 /home/runner/.oci/config

      - name: Fetch Availability Domain & Ubuntu ARM Image
        id: fetch-resources
        env:
          COMPARTMENT_RAW: ${{ secrets.OCI_COMPARTMENT_OCID }}
        run: |
          COMPARTMENT_ID=$(echo "$COMPARTMENT_RAW" | tr -d ' \r\n\t')
          echo "COMPARTMENT_ID=$COMPARTMENT_ID" >> $GITHUB_OUTPUT

          AD=$(oci iam availability-domain list \
            --compartment-id "$COMPARTMENT_ID" \
            --query "data[0].name" --raw-output)
          echo "AD=$AD" >> $GITHUB_OUTPUT

          IMAGE_ID=$(oci compute image list \
            --compartment-id "$COMPARTMENT_ID" \
            --operating-system "Canonical Ubuntu" \
            --shape "VM.Standard.A1.Flex" \
            --sort-by TIMECREATED --sort-order DESC \
            --query "data[?contains(\"operating-system-version\", '24.04') && contains(\"display-name\", 'aarch64')].id | [0]" \
            --raw-output)
          echo "IMAGE_ID=$IMAGE_ID" >> $GITHUB_OUTPUT

      - name: Hunt Loop (Every 15 seconds)
        env:
          SSH_KEY_RAW: ${{ secrets.SSH_PUBLIC_KEY }}
          SUBNET_RAW: ${{ secrets.OCI_SUBNET_OCID }}
        run: |
          SUBNET_ID=$(echo "$SUBNET_RAW" | tr -d ' \r\n\t')
          echo "$SSH_KEY_RAW" | tr -d '\r' > ssh_key.pub

          END_TIME=$((SECONDS + 240))
          ATTEMPT=1

          while [ $SECONDS -lt $END_TIME ]; do
            echo "--- Intento #$ATTEMPT ($(date +'%T')) ---"
            
            RESPONSE=$(oci compute instance launch \
              --availability-domain "${{ steps.fetch-resources.outputs.AD }}" \
              --compartment-id "${{ steps.fetch-resources.outputs.COMPARTMENT_ID }}" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus": 2, "memoryInGBs": 12}' \
              --image-id "${{ steps.fetch-resources.outputs.IMAGE_ID }}" \
              --subnet-id "$SUBNET_ID" \
              --display-name "ObliskIQ lite" \
              --assign-public-ip true \
              --ssh-authorized-keys-file ssh_key.pub 2>&1) || STATUS=$?

            if [ -z "$STATUS" ]; then
              echo "¡ÉXITO! Instancia ObliskIQ lite creada correctamente."
              echo "$RESPONSE"
              exit 0
            else
              if echo "$RESPONSE" | grep -qi "Out of host capacity"; then
                echo "Sin capacidad en Madrid. Reintentando en 15 segundos..."
                sleep 15
              else
                echo "Error de OCI:"
                echo "$RESPONSE"
                exit $STATUS
              fi
            fi

            ATTEMPT=$((ATTEMPT + 1))
            unset STATUS
          done

          echo "Fin del ciclo de 4 minutos. Esperando a la siguiente ejecución programada."

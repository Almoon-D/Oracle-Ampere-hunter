name: Hunt Oracle Ampere A1

on:
  schedule:
    # GitHub's shortest allowed interval. Scheduled runs on the shared pool are
    # regularly delayed by 10-30 minutes, so treat this as "roughly every few
    # minutes", not a guarantee. For a serious hunt, dispatch a long run.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Total minutes for this run, setup included (max 350 - a job cannot exceed 6h).'
        required: false
        default: '10'
      ocpu_ladder:
        description: 'OCPU sizes to try at each placement, largest first.'
        required: false
        default: '4 2 1'
      display_name:
        description: 'Name for the instance if one is captured.'
        required: false
        default: 'ObliskIQ-lite'

# Overlapping hunts would double the request rate and invite OCI throttling.
concurrency:
  group: ampere-hunt
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    env:
      # The CLI writes a key-file label warning to stderr on every call. The
      # key here is written fresh from a secret each run, so the advice does not
      # apply, and the noise sits in the middle of error output.
      SUPPRESS_LABEL_WARNING: 'True'

    timeout-minutes: ${{ fromJSON(github.event.inputs.duration_minutes || '10') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install OCI CLI
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Configure and verify OCI credentials
        env:
          OCI_API_KEY: ${{ secrets.OCI_API_KEY }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: ./scripts/oci-setup.sh

      - name: Write SSH public key
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SSH_PUBLIC_KEY" ] || { echo "::error::Secret SSH_PUBLIC_KEY is empty."; exit 1; }
          printf '%s\n' "$SSH_PUBLIC_KEY" | tr -d '\r' > ssh_key.pub

      - name: Hunt
        id: hunt
        env:
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_SUBNET_OCID: ${{ secrets.OCI_SUBNET_OCID }}
          OCPU_LADDER: ${{ github.event.inputs.ocpu_ladder || '4 2 1' }}
          DISPLAY_NAME: ${{ github.event.inputs.display_name || 'ObliskIQ-lite' }}
          DURATION_MINUTES: ${{ github.event.inputs.duration_minutes || '10' }}
        run: |
          set -euo pipefail
          # DURATION_MINUTES is the whole job budget and is also the job's
          # timeout-minutes. Hold back HEADROOM minutes so the hunt ends on its
          # own terms -- reporting a win, writing the summary -- rather than
          # being cut off mid-launch by the runner.
          HEADROOM=6
          MINUTES=$DURATION_MINUTES
          [ "$MINUTES" -gt 350 ] && MINUTES=350
          WINDOW=$(( (MINUTES - HEADROOM) * 60 ))
          [ "$WINDOW" -lt 60 ] && WINDOW=60
          echo "Job budget ${MINUTES}m, hunting window $(( WINDOW / 60 ))m."
          HUNT_SECONDS=$WINDOW ./scripts/hunt.sh

      - name: Open an issue when an instance is captured
        if: steps.hunt.outputs.result == 'launched'
        uses: actions/github-script@v7
        env:
          INSTANCE_ID: ${{ steps.hunt.outputs.instance_id }}
          PUBLIC_IP: ${{ steps.hunt.outputs.public_ip }}
          OCPUS: ${{ steps.hunt.outputs.ocpus }}
          MEMORY: ${{ steps.hunt.outputs.memory }}
          PLACEMENT: ${{ steps.hunt.outputs.placement }}
        with:
          script: |
            const { INSTANCE_ID, PUBLIC_IP, OCPUS, MEMORY, PLACEMENT } = process.env;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Ampere A1 captured: ${OCPUS} OCPU / ${MEMORY} GB`,
              body: [
                `An **VM.Standard.A1.Flex** instance was launched by [this run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
                '',
                `- Instance: \`${INSTANCE_ID}\``,
                `- Shape: ${OCPUS} OCPU / ${MEMORY} GB`,
                `- Placement: ${PLACEMENT}`,
                `- Public IP: ${PUBLIC_IP || 'still provisioning - check the OCI console'}`,
                '',
                'Later runs stop on their own once the free-tier allowance is used up,',
                'so nothing here will start a billable second instance. Disable the',
                'schedule when you are done hunting.',
              ].join('\n'),
            });

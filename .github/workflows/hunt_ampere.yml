name: Hunt Oracle Ampere A1

on:
  schedule:
    # Ejecuta el flujo cada 5 minutos
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  launch-instance:
    runs-on: ubuntu-latest

    steps:
      - name: Setup OCI CLI & Config
        env:
          OCI_KEY_RAW: ${{ secrets.OCI_API_KEY }}
        run: |
          pip install --no-cache-dir oci-cli

          # 1. Crear carpeta de configuración
          mkdir -p "$HOME/.oci"

          # 2. Volcar la clave respetando saltos de línea exactos
          printf "%s\n" "$OCI_KEY_RAW" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"

          # 3. Crear archivo de configuración con ruta absoluta
          cat <<EOF > "$HOME/.oci/config"
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=$HOME/.oci/oci_api_key.pem
          EOF
          chmod 600 "$HOME/.oci/config

      - name: Fetch Availability Domain & Ubuntu ARM Image
        id: fetch-resources
        run: |
          AD=$(oci iam availability-domain list \
            --compartment-id "${{ secrets.OCI_COMPARTMENT_OCID }}" \
            --query "data[0].name" --raw-output)
          echo "AD=$AD" >> $GITHUB_OUTPUT

          IMAGE_ID=$(oci compute image list \
            --compartment-id "${{ secrets.OCI_COMPARTMENT_OCID }}" \
            --operating-system "Canonical Ubuntu" \
            --shape "VM.Standard.A1.Flex" \
            --sort-by TIMECREATED --sort-order DESC \
            --query "data[?contains(\"operating-system-version\", '24.04') && contains(\"display-name\", 'aarch64')].id | [0]" \
            --raw-output)
          echo "IMAGE_ID=$IMAGE_ID" >> $GITHUB_OUTPUT

      - name: Hunt Loop (Every 15 seconds)
        env:
          SSH_KEY_RAW: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          printf "%s\n" "$SSH_KEY_RAW" > ssh_key.pub

          # El bucle dura 240 segundos (4 minutos) reintentando cada 15s
          END_TIME=$((SECONDS + 240))
          ATTEMPT=1

          while [ $SECONDS -lt $END_TIME ]; do
            echo "--- Intento #$ATTEMPT ($(date +'%T')) ---"
            
            RESPONSE=$(oci compute instance launch \
              --availability-domain "${{ steps.fetch-resources.outputs.AD }}" \
              --compartment-id "${{ secrets.OCI_COMPARTMENT_OCID }}" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus": 2, "memoryInGBs": 12}' \
              --image-id "${{ steps.fetch-resources.outputs.IMAGE_ID }}" \
              --subnet-id "${{ secrets.OCI_SUBNET_OCID }}" \
              --display-name "ObliskIQ lite" \
              --assign-public-ip true \
              --ssh-authorized-keys-file ssh_key.pub 2>&1) || STATUS=$?

            if [ -z "$STATUS" ]; then
              echo "¡ÉXITO! Instancia ObliskIQ lite creada correctamente."
              echo "$RESPONSE"
              exit 0
            else
              if echo "$RESPONSE" | grep -qi "Out of host capacity"; then
                echo "Sin capacidad en Madrid. Reintentando en 15 segundos..."
                sleep 15
              else
                echo "Error crítico de OCI:"
                echo "$RESPONSE"
                exit $STATUS
              fi
            fi

            ATTEMPT=$((ATTEMPT + 1))
            unset STATUS
          done

          echo "Fin del ciclo de 4 minutos. Esperando a la siguiente ejecución programada."
